name: build-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MemoryCleaner.sln

      - name: Build (Release)
        run: dotnet build MemoryCleaner.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/MemoryCleaner.Core.Tests/MemoryCleaner.Core.Tests.csproj -c Release --no-build
